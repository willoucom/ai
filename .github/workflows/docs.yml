name: Documentation

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7

      # This action alone is pinned down to its patch: it publishes no tag for
      # a major on its own, where every other action used here does.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          working-directory: docs
          python-version: "3.13"
          enable-cache: true

      - run: uv sync --frozen
      - run: uv run python gen.py
      - run: uv run zensical build --clean

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site
      - uses: actions/deploy-pages@v5
        id: deployment
